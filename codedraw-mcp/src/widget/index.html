<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>CodeDraw preview</title>
    <style>
      :root {
        --fg: #1e1e1e;
        --muted: #666;
        --bg: transparent;
        --btn-bg: #f1f3f5;
        --btn-fg: #1e1e1e;
        --btn-border: #dee2e6;
        --btn-hover: #e9ecef;
        --btn-ok: #37b24d;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --fg: #e6e6e6;
          --muted: #999;
          --btn-bg: #2b2f33;
          --btn-fg: #e6e6e6;
          --btn-border: #3a3f44;
          --btn-hover: #3a3f44;
          --btn-ok: #69db7c;
        }
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: var(--bg);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: var(--fg);
      }
      #wrap {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 12px;
        box-sizing: border-box;
      }
      #preview {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 180px;
        border-radius: 6px;
      }
      #preview svg,
      #preview img {
        max-width: 100%;
        height: auto;
        display: block;
      }
      #preview pre {
        white-space: pre-wrap;
        font-size: 11px;
        margin: 0;
        width: 100%;
        max-height: 340px;
        overflow: auto;
      }
      #empty {
        font-size: 13px;
        color: var(--muted);
        padding: 24px;
      }
      #bar {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
        font-size: 12px;
        color: var(--muted);
      }
      #bar .spacer {
        flex: 1;
      }
      button,
      a.btn {
        appearance: none;
        border: 1px solid var(--btn-border);
        background: var(--btn-bg);
        color: var(--btn-fg);
        padding: 5px 10px;
        border-radius: 5px;
        font-size: 12px;
        cursor: pointer;
        text-decoration: none;
        line-height: 1.2;
      }
      button:hover,
      a.btn:hover {
        background: var(--btn-hover);
      }
      button.copied {
        color: var(--btn-ok);
        border-color: var(--btn-ok);
      }
    </style>
  </head>
  <body>
    <div id="wrap">
      <div id="preview"><div id="empty">No diagram yet.</div></div>
      <div id="bar" hidden>
        <span id="dims"></span>
        <span class="spacer"></span>
        <a class="btn" id="dlSvg" hidden>Download SVG</a>
        <a class="btn" id="dlPng" hidden>Download PNG</a>
        <button id="copySvg" hidden>Copy SVG</button>
      </div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
