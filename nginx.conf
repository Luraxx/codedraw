server {
  listen 80 default_server;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # gzip
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/json application/javascript
             application/wasm application/xml image/svg+xml font/woff2;

  # API proxy — forward /api/* to the internal api container.
  # proxy_pass with a variable does not strip the location prefix, so we
  # use an explicit rewrite to drop /api/ before forwarding.
  location /api/ {
    resolver           127.0.0.11 valid=10s ipv6=off;
    set $api_upstream  ${API_UPSTREAM};
    rewrite            ^/api/(.*)$ /$1 break;
    proxy_pass         http://$api_upstream;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
    add_header         Access-Control-Allow-Origin  "*";
    add_header         Access-Control-Allow-Headers "authorization, content-type";
    add_header         Access-Control-Allow-Methods "GET, POST, OPTIONS";
    if ($request_method = OPTIONS) { return 204; }
  }

  # MCP proxy — forward /mcp (and /mcp/) to the internal codedraw-mcp
  # container. ChatGPT / Claude Desktop / Inspector all POST JSON-RPC here.
  # The MCP server runs stateless, so no sticky sessions or session-id
  # forwarding are needed; just plain HTTP with a generous read timeout.
  # The upstream already exposes the endpoint at /mcp, so we forward the
  # URI verbatim (no rewrite).
  location /mcp {
    resolver           127.0.0.11 valid=10s ipv6=off;
    set $mcp_upstream  ${MCP_UPSTREAM};
    proxy_pass         http://$mcp_upstream;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   Connection        "";
    proxy_buffering    off;
    proxy_read_timeout 120s;
    add_header         Access-Control-Allow-Origin  "*";
    add_header         Access-Control-Allow-Headers "authorization, content-type, mcp-session-id, mcp-protocol-version, accept";
    add_header         Access-Control-Allow-Methods "GET, POST, DELETE, OPTIONS";
    add_header         Access-Control-Expose-Headers "mcp-session-id";
    if ($request_method = OPTIONS) { return 204; }
  }

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }

  # AI / agent-discoverable DSL reference. The vite build emits both files
  # from the repo-root AGENTS.md, so always serve them as markdown (not the
  # SPA fallback) with a permissive CORS header for cross-origin fetches.
  location = /AGENTS.md {
    add_header Content-Type "text/markdown; charset=utf-8";
    add_header Access-Control-Allow-Origin "*";
    add_header Cache-Control "public, max-age=300";
    try_files $uri =404;
  }
  location = /llms.txt {
    add_header Content-Type "text/markdown; charset=utf-8";
    add_header Access-Control-Allow-Origin "*";
    add_header Cache-Control "public, max-age=300";
    try_files $uri =404;
  }

  # Long cache for hashed assets
  location ~* \.(?:js|css|woff2|svg|png|jpg|jpeg|gif|webp|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # No-cache for HTML so updates are picked up immediately
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
}
