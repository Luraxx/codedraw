server {
  listen 80 default_server;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # gzip
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/json application/javascript
             application/wasm application/xml image/svg+xml font/woff2;

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }

  # AI / agent-discoverable DSL reference. The vite build emits both files
  # from the repo-root AGENTS.md, so always serve them as markdown (not the
  # SPA fallback) with a permissive CORS header for cross-origin fetches.
  location = /AGENTS.md {
    add_header Content-Type "text/markdown; charset=utf-8";
    add_header Access-Control-Allow-Origin "*";
    add_header Cache-Control "public, max-age=300";
    try_files $uri =404;
  }
  location = /llms.txt {
    add_header Content-Type "text/markdown; charset=utf-8";
    add_header Access-Control-Allow-Origin "*";
    add_header Cache-Control "public, max-age=300";
    try_files $uri =404;
  }

  # Long cache for hashed assets
  location ~* \.(?:js|css|woff2|svg|png|jpg|jpeg|gif|webp|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # No-cache for HTML so updates are picked up immediately
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
}
