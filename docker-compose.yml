# Replace OWNER with your GitHub user/org (or your private registry path)
# before pulling on a server. The CI workflow auto-publishes images to
# ghcr.io/<repo-owner>/codedraw-{web,api}.
services:
  web:
    image: ghcr.io/OWNER/codedraw-web:latest
    container_name: codedraw-web
    restart: unless-stopped
    expose:
      - "80"
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3

  api:
    image: ghcr.io/OWNER/codedraw-api:latest
    container_name: codedraw-api
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    environment:
      CODEDRAW_WEB_URL: "http://web"
      PORT: "3000"
      # CODEDRAW_API_KEY: "set-me-via-env-file"
      # CODEDRAW_MAX_CODE_BYTES: "65536"
      # CODEDRAW_RENDER_TIMEOUT_MS: "15000"
    ports:
      - "8081:3000"
    init: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  mcp:
    image: ghcr.io/OWNER/codedraw-mcp:latest
    container_name: codedraw-mcp
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      CODEDRAW_API_URL: "http://api:3000"
      PORT: "3000"
    ports:
      - "8082:3000"
    init: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
